version: '3.8'
services:
  # PHP Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravelapp_php
    container_name: laravelapp_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - laravelapp_network

  # Nginx Service
  webserver:
    image: nginx:alpine
    container_name: laravelapp_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/:/etc/nginx/conf.d/
    depends_on:
      - app
    networks:
      - laravelapp_network

  # MariaDB Service
  db:
    image: mariadb
    container_name: laravelapp_mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: your_root_password
      MYSQL_PASSWORD: your_password
      MYSQL_USER: laraveluser
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - laravelapp_network

  # Redis service
  redis:
    image: redis:alpine
    container_name: laravelapp_redis
    ports:
      - "6379:6379"
    networks:
      - laravelapp_network
      
# Volumes
volumes:
  dbdata:
    driver: local

# Networks
networks:
  laravelapp_network:
    driver: bridge

